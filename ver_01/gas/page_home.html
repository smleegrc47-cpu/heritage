<!-- page_home.html - 1. 홈화면 -->
<section id="page_home" class="tab-section active">
  <!-- Top Banner Header -->
  <div class="glass-card" style="background: linear-gradient(135deg, rgba(114,9,183,0.35), rgba(0,245,212,0.18)); margin-bottom: 28px; position: relative; overflow: hidden;">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px;">
      <div>
        <span class="badge badge-dong" style="margin-bottom: 10px;">✨ 세종시 스마트 문화유산 AI</span>
        <h1 style="font-size: 2.1rem; font-weight: 900; margin-bottom: 8px; line-height: 1.2;">
          역사와 미래가 함께하는 세종시 문화유산
        </h1>
        <p style="color: var(--text-sub); font-size: 1.05rem; margin-bottom: 20px;">
          세종시 문화유산을 한눈에 탐색하고 나만의 맞춤 여행 코스를 만들어보세요.
        </p>
      </div>
    </div>

    <!-- AI Search Bar -->
    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <input type="text" id="homeSearchInput" placeholder="자연어 AI 검색 (예: 조선시대 관아 건물, 전의면 산사 단청, 한옥 쉼터공원...)" style="flex: 1; padding: 14px 18px; border-radius: var(--radius-md); background: rgba(0,0,0,0.45); border: 1px solid var(--border-color); color: #fff; font-size: 0.98rem;" onkeyup="if(event.key==='Enter') submitHomeSearch()" />
      <button class="btn-primary" onclick="submitHomeSearch()" style="padding: 14px 26px;">
        🔍 AI 검색
      </button>
    </div>
  </div>

  <!-- Real-time Count Summary Bar -->
  <div class="glass-card" style="display: flex; justify-content: space-around; align-items: center; padding: 18px 24px; margin-bottom: 32px; background: rgba(15, 23, 42, 0.7); text-align: center;">
    <div>
      <span style="font-size: 0.88rem; color: var(--text-sub); display: block;">🏛️ 국가/지자체 지정 문화유산</span>
      <strong style="font-size: 1.6rem; color: var(--accent-cyan);" class="count-official-text">0</strong><span style="font-size: 1rem; color: var(--accent-cyan)">건</span>
    </div>
    <div style="width: 1px; height: 36px; background: var(--border-color);"></div>
    <div>
      <span style="font-size: 0.88rem; color: var(--text-sub); display: block;">🌱 시민 제보 발굴 문화유산</span>
      <strong style="font-size: 1.6rem; color: var(--accent-amber);" class="count-citizen-text">0</strong><span style="font-size: 1rem; color: var(--accent-amber)">건</span>
    </div>
  </div>

  <!-- Section 1: 이달의 세종시 대표 문화유산 Card 3 -->
  <div style="margin-bottom: 36px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h3 style="font-size: 1.35rem; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 8px;">
        <span>⭐</span> 이달의 세종시 대표 문화유산
      </h3>
      <button class="btn-secondary" onclick="navigateTo('status_official')" style="font-size: 0.85rem;">전체보기 ➔</button>
    </div>

    <div id="homeFeaturedCards" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
      <!-- JavaScript Dynamic Rendered -->
    </div>
  </div>

  <!-- [2단계 확장 영역] 시민 추천 문화유산 코스 (Supabase heritages 테이블 동적 2선 노출) -->
  <div style="margin-bottom: 36px;">
    <h3 style="font-size: 1.35rem; font-weight: 800; color: var(--text-main); margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
      <span>🚩</span> 시민 추천 문화유산 코스 리스트 (Supabase DB)
    </h3>
    <div id="homeCitizenCourseListGrid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px;">
      <!-- JavaScript Dynamic Rendered from Supabase heritages table (2 items) -->
    </div>
  </div>

  <!-- [2단계 확장 영역] 내게 맞는 문화유산 코스 (사용자 조건 기반 추천 스텁) -->
  <div class="glass-card" style="border: 1px dashed var(--accent-cyan); background: rgba(0,245,212,0.03);">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
      <div>
        <h3 style="font-size: 1.15rem; font-weight: 700; color: var(--accent-cyan); display: flex; align-items: center; gap: 8px;">
          <span>🎯</span> 내게 맞는 문화유산 코스 (지능형 맞춤 추천)
        </h3>
        <p style="font-size: 0.88rem; color: var(--text-sub); margin-top: 4px;">
          방문 동반자(가족/연인/홀로), 소요시간, 선호 시대에 맞춘 개인화 추천 기능입니다.
        </p>
      </div>
      <button class="btn-secondary" onclick="recommendCustomUserCourse()" style="border-color: var(--accent-cyan); color: var(--accent-cyan);">
        🎲 맞춤 코스 추천받기 (v1 스텁)
      </button>
    </div>
  </div>
</section>

<script>
  function renderHomeView() {
    var container = document.getElementById('homeFeaturedCards');
    var courseGrid = document.getElementById('homeCitizenCourseListGrid');

    var state = window.appState || (typeof appState !== 'undefined' ? appState : { officialHeritages: [], likesMap: {} });
    var officialList = state.officialHeritages || [];
    var list = officialList.slice(0, 3);
    var likesMap = state.likesMap || {};

    if (container) {
      container.innerHTML = list.map(function(h) {
        var eraText = h.era_normalized || h.era || '조선시대';
        var dongText = h.dong_eup_myeon || h.dong || '세종시';
        var imgUrl = h.image_url || 'https://images.unsplash.com/photo-1548625149-fc4a29cf7092?w=800';
        var baseLikes = h.like_count || 100;
        var totalLikes = baseLikes + (likesMap[h.id] || 0);

        return '<div class="glass-card" style="cursor: pointer;" onclick="openSearchDetailById(\'' + h.id + '\')">' +
            '<img src="' + imgUrl + '" style="width: 100%; height: 165px; object-fit: cover; border-radius: var(--radius-md); margin-bottom: 12px;" />' +
            '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">' +
              '<div>' +
                '<span class="badge badge-era">' + eraText + '</span> ' +
                '<span class="badge badge-dong">' + dongText + '</span>' +
              '</div>' +
              '<button class="btn-like" onclick="toggleLike(\'' + h.id + '\', event)">' +
                '❤️ <span class="like-count-' + h.id + '" data-base-likes="' + baseLikes + '">' + totalLikes + '</span>' +
              '</button>' +
            '</div>' +
            '<h4 style="font-size: 1.15rem; font-weight: 700; color: #fff; margin-bottom: 6px;">' + h.name + '</h4>' +
            '<p style="font-size: 0.83rem; color: var(--text-sub); overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">' +
              (h.description || '') +
            '</p>' +
          '</div>';
      }).join('');
    }

    if (courseGrid) {
      renderHomeCitizenCourses(officialList.slice(0, 2), courseGrid);
    }
  }

  function renderHomeCitizenCourses(items, grid) {
    if (!grid) return;
    if (!items || items.length === 0) {
      grid.innerHTML = '<div class="glass-card" style="grid-column: 1/-1; text-align: center; color: var(--text-sub);">Supabase heritages 데이터 로딩 중입니다...</div>';
      return;
    }

    var top2 = items.slice(0, 2);
    grid.innerHTML = top2.map(function(h, idx) {
      var img = h.image_url || (h.images && h.images[0] ? h.images[0].url : '') || 'https://images.unsplash.com/photo-1548013146-72479768bada?w=600&q=80';
      var title = h.name || '세종 문화유산 추천 코스';
      var dong = h.dong_eup_myeon || h.dong || '세종시';
      var desc = h.description || h.thinking_point || 'Supabase heritages 테이블 기반 추천 문화유산 데이터입니다.';
      var baseLike = (h.like_count || 50) + (idx * 25);
      var currentLike = baseLike + (appState.likesMap[h.id] || 0);

      return '<div class="glass-card" style="display: flex; flex-direction: column; gap: 12px;">' +
          '<img src="' + img + '" style="width: 100%; height: 160px; object-fit: cover; border-radius: var(--radius-md);" alt="' + title + '" />' +
          '<div style="display: flex; justify-content: space-between; align-items: center;">' +
            '<span class="badge badge-dong">🏛️ Supabase heritages [' + dong + ']</span>' +
            '<button class="btn-like" onclick="toggleLike(\'' + (h.id || idx) + '\', event)">' +
              '❤️ <span class="like-count-' + (h.id || idx) + '" data-base-likes="' + baseLike + '">' + currentLike + '</span>' +
            '</button>' +
          '</div>' +
          '<h4 style="font-size: 1.15rem; font-weight: 700;">' + title + '</h4>' +
          '<p style="font-size: 0.85rem; color: var(--accent-cyan);">📍 ' + (h.address || dong) + '</p>' +
          '<p style="font-size: 0.83rem; color: var(--text-sub); line-height: 1.5; height: 38px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">' +
            '"' + desc + '"' +
          '</p>' +
          '<div style="display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border-color);">' +
            '<span style="font-size: 0.8rem; color: var(--text-muted);">✨ Supabase DB 2선 노출</span>' +
            '<button class="btn-primary" style="padding: 8px 16px; font-size: 0.85rem;" onclick="loadPresetCourseToPlanner([\'' + h.id + '\'])">' +
              '🚶 나도가기' +
            '</button>' +
          '</div>' +
        '</div>';
    }).join('');
  }

  function submitHomeSearch() {
    var query = document.getElementById('homeSearchInput') ? document.getElementById('homeSearchInput').value.trim() : '';
    
    var state = window.appState || (typeof appState !== 'undefined' ? appState : { officialHeritages: [], citizenHeritages: [] });
    var official = state.officialHeritages || [];
    var citizen = state.citizenHeritages || [];

    var matchedItems = [];

    if (query) {
      var q = query.toLowerCase();
      matchedItems = official.filter(function(h) {
        return (h.name && h.name.toLowerCase().includes(q)) ||
               (h.dong_eup_myeon && h.dong_eup_myeon.toLowerCase().includes(q)) ||
               (h.description && h.description.toLowerCase().includes(q)) ||
               (h.era && h.era.toLowerCase().includes(q));
      });

      if (matchedItems.length === 0) {
        matchedItems = citizen.filter(function(c) {
          return c.status === '승인' &&
                 ((c.name && c.name.toLowerCase().includes(q)) ||
                  (c.address && c.address.toLowerCase().includes(q)) ||
                  (c.reason && c.reason.toLowerCase().includes(q)));
        });
      }
    }

    if (!matchedItems || matchedItems.length === 0) {
      matchedItems = official.slice(0, 3);
    }

    // "문화유산 나만의 코스 만들기"의 courseList에 검색 결과 추가
    state.courseList = matchedItems.slice(0, 4);

    showToast("🤖 AI 검색 결과 [" + state.courseList.length + "개] 유산이 '문화유산 나만의 코스 만들기' 화면 구성요소로 불러와졌습니다!");
    navigateTo('course', { searchQuery: query });
  }

  function loadPresetCourseToPlanner(heritageIds) {
    appState.courseList = [];
    heritageIds.forEach(function(id) {
      var item = appState.officialHeritages.find(function(h) { return h.id === id; });
      if (item) appState.courseList.push(item);
    });
    showToast("추천 코스 구성이 코스 만들기에 불러와졌습니다!");
    navigateTo('course');
  }

  /* TODO: v2 개인화 AI 맞춤 추천 알고리즘 구현 예정 (v1 스텁 함수) */
  function recommendCustomUserCourse() {
    showToast("💡 [v1 스텁] 사용자 취향 조건 기반 AI 추천 알고리즘이 가동되었습니다.");
    loadPresetCourseToPlanner(['h1', 'h2', 'h3']);
  }
</script>
