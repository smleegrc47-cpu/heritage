<!-- page_admin.html - 10. 관리자 페이지 (관리자 전용) -->
<section id="page_admin" class="tab-section">
  <div style="margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px;">
    <div>
      <span class="badge badge-era" style="margin-bottom: 6px;">🔒 Administrator Only</span>
      <h1 class="page-title">세종 문화유산 통합 관리자 센터</h1>
      <p class="page-desc">시민 제보 검토·승인, 편의시설 개선 요청 모니터링 및 종합 통계 보고서 생성을 수행합니다.</p>
    </div>

    <div style="display: flex; gap: 10px;">
      <button class="btn-secondary" onclick="filterAdminImprovementNeeded()">
        ⚠️ 개선 필요 항목만 보기
      </button>
      <button class="btn-primary" onclick="generateAdminSummaryReport()">
        📄 보고서 작성 (Google Docs/PDF)
      </button>
    </div>
  </div>

  <!-- Admin Stats Overview -->
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 28px;">
    <div class="glass-card" style="text-align: center; padding: 20px;">
      <span style="font-size: 0.85rem; color: var(--text-sub);">🏛️ 지정 문화유산</span>
      <strong style="font-size: 1.8rem; color: var(--accent-cyan); display: block; margin-top: 4px;" class="count-official-text">0</strong>
    </div>
    <div class="glass-card" style="text-align: center; padding: 20px;">
      <span style="font-size: 0.85rem; color: var(--text-sub);">⏳ 제보 대기 중</span>
      <strong id="adminPendingCountText" style="font-size: 1.8rem; color: var(--accent-amber); display: block; margin-top: 4px;">0</strong>
    </div>
    <div class="glass-card" style="text-align: center; padding: 20px;">
      <span style="font-size: 0.85rem; color: var(--text-sub);">✅ 승인 완료 제보</span>
      <strong id="adminApprovedCountText" style="font-size: 1.8rem; color: var(--accent-blue); display: block; margin-top: 4px;">0</strong>
    </div>
    <div class="glass-card" style="text-align: center; padding: 20px;">
      <span style="font-size: 0.85rem; color: var(--text-sub);">⚠️ 시설 개선 필요 건</span>
      <strong id="adminImprovementCountText" style="font-size: 1.8rem; color: var(--accent-rose); display: block; margin-top: 4px;">2</strong>
    </div>
  </div>

  <!-- Citizen Submissions Management Section (Unapproved vs Approved) -->
  <div class="glass-card" style="margin-bottom: 28px;">
    <h3 style="font-size: 1.2rem; font-weight: 700; color: var(--accent-cyan); margin-bottom: 16px;">
      🌱 시민 제보 문화유산 검토 및 승인 관리
    </h3>
    <div id="adminCitizenSubmissionsList" style="display: flex; flex-direction: column; gap: 12px;">
      <!-- Dynamically populated via renderAdminView() -->
    </div>
  </div>

  <!-- Citizen Reviews & Improvement Requests List -->
  <div class="glass-card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h3 style="font-size: 1.2rem; font-weight: 700; color: #fff;">
        💬 시민 탐방 후기 및 편의시설 개선 요청 건
      </h3>
      <select id="adminReviewFilterSelect" onchange="filterAdminReviews()" style="padding: 8px 12px; border-radius: 8px; background: #151e36; border: 1px solid var(--border-color); color: #fff; font-size: 0.85rem;">
        <option value="all">전체 후기 보기</option>
        <option value="improvement">개선 필요만 보기 (주차/화장실)</option>
        <option value="low_rating">낮은 별점 (1~2점)</option>
      </select>
    </div>

    <div id="adminReviewsList" style="display: flex; flex-direction: column; gap: 12px;">
      <!-- Dynamically populated -->
    </div>
  </div>
</section>

<script>
  function renderAdminView() {
    // Access Control check
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.withSuccessHandler(function(isAdmin) {
        if (!isAdmin) {
          alert("🔒 관리자 권한이 없습니다. (Session Email 검증 실패)");
          navigateTo('home');
          return;
        }
        populateAdminData();
      }).checkIsAdminGAS();
    } else {
      populateAdminData();
    }
  }

  function populateAdminData() {
    var pendingList = appState.citizenHeritages.filter(function(h) { return h.status === '대기'; });
    var approvedList = appState.citizenHeritages.filter(function(h) { return h.status === '승인'; });

    document.getElementById('adminPendingCountText').innerText = pendingList.length;
    document.getElementById('adminApprovedCountText').innerText = approvedList.length;

    var container = document.getElementById('adminCitizenSubmissionsList');
    if (!container) return;

    var allSubmissions = appState.citizenHeritages;
    if (!allSubmissions.length) {
      container.innerHTML = '<div style="color: var(--text-sub); text-align: center; padding: 20px 0;">접수된 제보 건이 없습니다.</div>';
      return;
    }

    container.innerHTML = allSubmissions.map(function(item, idx) {
      var isPending = item.status === '대기';
      var badgeClass = isPending ? 'badge-status-pending' : item.status === '승인' ? 'badge-status-approved' : 'badge-status-rejected';

      return `
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); border-radius: var(--radius-md); flex-wrap: wrap; gap: 12px;">
          <div>
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 4px;">
              <span class="badge ${badgeClass}">${item.status || '대기'}</span>
              <strong style="font-size: 1.05rem; color: #fff;">${item.name}</strong>
              <span style="font-size: 0.8rem; color: var(--accent-cyan);">(${item.address})</span>
            </div>
            <p style="font-size: 0.82rem; color: var(--text-sub);">${item.reason}</p>
            <span style="font-size: 0.76rem; color: var(--text-muted);">제보자: ${item.submitted_by || 'user@sejong.go.kr'}</span>
          </div>

          <div style="display: flex; gap: 8px;">
            ${isPending ? `
              <button class="btn-primary" style="padding: 6px 14px; font-size: 0.82rem;" onclick="approveCitizenSubmission('${item.id}')">✅ 승인</button>
              <button class="btn-secondary" style="padding: 6px 14px; font-size: 0.82rem; border-color:#ef4444; color:#ef4444;" onclick="rejectCitizenSubmission('${item.id}')">❌ 반려</button>
            ` : `
              <button class="btn-secondary" style="padding: 6px 14px; font-size: 0.82rem;" onclick="editCitizenSubmission('${item.id}')">✏️ 검토 수정</button>
            `}
          </div>
        </div>
      `;
    }).join('');

    filterAdminReviews();
  }

  function approveCitizenSubmission(id) {
    var item = appState.citizenHeritages.find(function(h) { return h.id === id; });
    if (item) {
      item.status = '승인';
      showToast("✅ '" + item.name + "' 제보 건이 승인 노출되었습니다.");
      updateCountsSummary();
      populateAdminData();
    }
  }

  function rejectCitizenSubmission(id) {
    var reason = prompt("반려 사유를 입력하세요:", "데이터 불명확 및 관련성 부족");
    if (!reason) return;
    var item = appState.citizenHeritages.find(function(h) { return h.id === id; });
    if (item) {
      item.status = '반려';
      item.reject_reason = reason;
      showToast("❌ 제보 건이 반려 처리되었습니다.");
      populateAdminData();
    }
  }

  function editCitizenSubmission(id) {
    var item = appState.citizenHeritages.find(function(h) { return h.id === id; });
    if (item) {
      var newName = prompt("문화유산명 수정:", item.name);
      if (newName) {
        item.name = newName;
        populateAdminData();
        showToast("제보 정보가 수정되었습니다.");
      }
    }
  }

  function filterAdminReviews() {
    var filterVal = document.getElementById('adminReviewFilterSelect') ? document.getElementById('adminReviewFilterSelect').value : 'all';
    var container = document.getElementById('adminReviewsList');
    if (!container) return;

    var mockReviews = [
      { id: 'r1', heritageName: '연기아문', rating: 5, text: '관아 정문 전경이 매우 훌륭합니다. 주차 공간이 잘 정비되어 있습니다.', isImprovementNeeded: false },
      { id: 'r2', heritageName: '비암사 극락보전', rating: 4, text: '진입로 주차장 공간 확충이 필요합니다. 공중화장실 청결도 개선 요구.', isImprovementNeeded: true },
      { id: 'r3', heritageName: '합강리 선사유적', rating: 2, text: '안내 표지판과 공중화장실이 부족하여 개선이 시급합니다.', isImprovementNeeded: true }
    ];

    var filtered = mockReviews.filter(function(r) {
      if (filterVal === 'improvement') return r.isImprovementNeeded;
      if (filterVal === 'low_rating') return r.rating <= 2;
      return true;
    });

    container.innerHTML = filtered.map(function(r) {
      return `
        <div style="background: rgba(255,255,255,0.04); border: 1px solid var(--border-color); padding: 12px 16px; border-radius: var(--radius-md); display: flex; justify-content: space-between; align-items: center;">
          <div>
            <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
              <strong style="color: var(--accent-cyan); font-size: 0.95rem;">${r.heritageName}</strong>
              <span style="color: #ffb703; font-size: 0.85rem;">${'⭐'.repeat(r.rating)}</span>
              ${r.isImprovementNeeded ? '<span class="badge badge-status-rejected">⚠️ 시설 개선 필요</span>' : ''}
            </div>
            <p style="font-size: 0.85rem; color: #e2e8f0;">${r.text}</p>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterAdminImprovementNeeded() {
    var select = document.getElementById('adminReviewFilterSelect');
    if (select) {
      select.value = 'improvement';
      filterAdminReviews();
      showToast("⚠️ 개선 필요 항목만 필터링되었습니다.");
    }
  }

  function generateAdminSummaryReport() {
    showToast("📄 Google Docs / PDF 종합 통계 보고서 생성이 요청되었습니다.");
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.withSuccessHandler(function(res) {
        alert("📄 보고서 생성이 완료되었습니다!\n" + (res ? res.url : 'Google Drive에 저장되었습니다.'));
      }).generateAdminReportGAS();
    } else {
      setTimeout(function() {
        alert("📄 [Mock 승인] '세종시 문화유산 종합 현황 및 개선사항 통계 보고서'가 Google Docs / PDF로 성공적으로 작성되었습니다.");
      }, 1000);
    }
  }
</script>
