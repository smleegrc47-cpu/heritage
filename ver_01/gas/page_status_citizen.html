<!-- page_status_citizen.html - 3. 문화유산 현황 (시민 문화유산) -->
<section id="page_status_citizen" class="tab-section">
  <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; flex-wrap: wrap; gap: 14px;">
    <div>
      <h1 class="page-title">시민 제보 문화유산 현황</h1>
      <p class="page-desc">
        지정 등록 문화유산 외에 시민들의 참여 제보로 세종의 숨은 새로운 문화유산 DB를 함께 구축해 나가고 있습니다.
      </p>
    </div>

    <div style="display: flex; gap: 12px; align-items: center;">
      <span style="font-size: 0.9rem; color: var(--text-sub);">
        승인 노출 유산: <strong style="color: var(--accent-amber);" class="count-citizen-text">0</strong>건
      </span>
      <button class="btn-primary" onclick="openCitizenReportModal()">
        ✍️ 신규 문화유산 제보하기
      </button>
    </div>
  </div>

  <!-- Approved Citizen Heritages Grid -->
  <div id="citizenApprovedGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;">
    <!-- Rendered via renderStatusCitizenView() -->
  </div>

  <!-- Citizen Report Modal Form -->
  <div id="citizenReportModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 14px; margin-bottom: 18px;">
        <h2 style="font-size: 1.3rem; font-weight: 800; color: var(--accent-cyan);">
          🌱 시민 문화유산 발굴 제보서
        </h2>
      </div>

      <form onsubmit="submitCitizenHeritageForm(event)" style="display: flex; flex-direction: column; gap: 16px;">
        <div>
          <label style="display: block; font-size: 0.88rem; color: var(--text-sub); margin-bottom: 6px; font-weight: 600;">
            문화유산 명칭 <span style="color: var(--accent-cyan)">*</span>
          </label>
          <input type="text" id="citFormName" placeholder="예: 금남면 용포리 옛 우물터" required style="width: 100%; padding: 12px; border-radius: var(--radius-md); background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: #fff;" />
        </div>

        <div>
          <label style="display: block; font-size: 0.88rem; color: var(--text-sub); margin-bottom: 6px; font-weight: 600;">
            정확한 위치 / 소재지 주소 <span style="color: var(--accent-cyan)">*</span>
          </label>
          <div style="display: flex; gap: 8px;">
            <input type="text" id="citFormAddress" placeholder="예: 세종특별자치시 금남면 용포리 12" required style="flex: 1; padding: 12px; border-radius: var(--radius-md); background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: #fff;" />
            <button type="button" class="btn-secondary" onclick="acquireCurrentGPSLocation()" style="font-size: 0.8rem;">📍 GPS 좌표</button>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
          <div>
            <label style="font-size: 0.8rem; color: var(--text-muted);">위도 (Lat)</label>
            <input type="text" id="citFormLat" value="36.4800" readonly style="width: 100%; padding: 8px; border-radius: 8px; background: rgba(0,0,0,0.4); border: 1px solid var(--border-color); color: var(--text-sub); font-size: 0.85rem;" />
          </div>
          <div>
            <label style="font-size: 0.8rem; color: var(--text-muted);">경도 (Lng)</label>
            <input type="text" id="citFormLng" value="127.2800" readonly style="width: 100%; padding: 8px; border-radius: 8px; background: rgba(0,0,0,0.4); border: 1px solid var(--border-color); color: var(--text-sub); font-size: 0.85rem;" />
          </div>
        </div>

        <div>
          <label style="display: block; font-size: 0.88rem; color: var(--text-sub); margin-bottom: 6px; font-weight: 600;">
            추천 이유 및 역사적 가치 <span style="color: var(--accent-cyan)">*</span>
          </label>
          <textarea id="citFormReason" rows="3" placeholder="해당 문화유산의 역사적 배경, 주민 생활 가치, 보존 필요성을 자세히 기재해 주세요." required style="width: 100%; padding: 12px; border-radius: var(--radius-md); background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: #fff;"></textarea>
        </div>

        <div>
          <label style="display: block; font-size: 0.88rem; color: var(--text-sub); margin-bottom: 6px; font-weight: 600;">
            사진 업로드 (Google Drive 저장)
          </label>
          <input type="file" id="citFormPhoto" accept="image/*" style="width: 100%; padding: 8px; border-radius: var(--radius-md); background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); color: var(--text-sub); font-size: 0.85rem;" />
        </div>

        <div style="background: rgba(0,245,212,0.08); border: 1px solid rgba(0,245,212,0.2); padding: 12px; border-radius: 10px; font-size: 0.82rem; color: var(--accent-cyan);">
          📌 <b>제보 안내:</b> 제출 시 상태는 <b>'대기'</b>로 등록되며, 담당자 현장 확인 후 승인 시 공공 목록에 노출됩니다. 제출 현황은 <b>[나만의 문화유산 > 내가 추천한 문화유산]</b>에서 본인 확인이 가능합니다.
        </div>

        <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px;">
          <button type="button" class="btn-secondary" onclick="closeCitizenReportModal()" style="padding: 10px 18px;">취소</button>
          <button type="submit" class="btn-primary" style="padding: 10px 18px; width: auto;">제보 제출하기</button>
        </div>
      </form>
    </div>
  </div>
</section>

<script>
  function renderStatusCitizenView() {
    var grid = document.getElementById('citizenApprovedGrid');
    if (!grid) return;
    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--accent-cyan); padding: 20px;">☁️ citizen_recommendations 테이블에서 최신 10개 시민 제보 유산을 로딩 중입니다...</div>';

    function renderItems(items) {
      if (!items || !Array.isArray(items) || items.length === 0) {
        grid.innerHTML = '<div class="glass-card" style="grid-column: 1/-1; text-align: center; color: var(--text-sub);">현재 등록된 시민 제보 문화유산(citizen_recommendations)이 없습니다. 첫 번째 유산을 제보해 보세요!</div>';
        var countBadgeZero = document.querySelector('.count-citizen-text');
        if (countBadgeZero) countBadgeZero.innerText = '0';
        return;
      }

      var top10 = items.slice(0, 10);
      var countBadge = document.querySelector('.count-citizen-text');
      if (countBadge) {
        countBadge.innerText = top10.length;
      }

      grid.innerHTML = top10.map(function(h, idx) {
        var statusBadgeClass = (h.status === '승인' || h.status === 'approved') ? 'badge-citizen' : 'badge-era';
        var statusText = h.status || '신청중';
        var imgUrl = h.image_url || h.photo_url || 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600&q=80';
        var itemAddress = h.address || h.dong || '세종특별자치시';
        var itemReason = h.reason || h.description || h.thinking_point || '시민 제보 문화유산';

        return `
          <div class="glass-card">
            <img src="${imgUrl}" style="width: 100%; height: 160px; object-fit: cover; border-radius: var(--radius-md); margin-bottom: 12px;" alt="citizen_recommendation" />
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
              <span class="badge ${statusBadgeClass}">🌱 시민 제보 (${statusText})</span>
              <button class="btn-like" onclick="toggleLike('${h.id || idx}', event)">
                ❤️ <span class="like-count-${h.id || idx}">${h.like_count || h.recommend_count || 1}</span>
              </button>
            </div>
            <h3 style="font-size: 1.15rem; font-weight: 700; color: #fff; margin-bottom: 6px;">${h.name || '미정 유산명'}</h3>
            <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px;">📍 ${itemAddress}</p>
            <p style="font-size: 0.82rem; color: var(--text-sub); line-height: 1.5; height: 38px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">
              ${itemReason}
            </p>
          </div>
        `;
      }).join('');
    }

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.data && Array.isArray(res.data) && res.data.length > 0) {
            renderItems(res.data);
          } else if (res && Array.isArray(res) && res.length > 0) {
            renderItems(res);
          } else {
            fetchDirectCitizenRecommendations(renderItems);
          }
        })
        .withFailureHandler(function() {
          fetchDirectCitizenRecommendations(renderItems);
        })
        .fetchCitizenRecommendationsGAS();
    } else {
      fetchDirectCitizenRecommendations(renderItems);
    }
  }

  function fetchDirectCitizenRecommendations(callback) {
    var supabaseUrl = 'https://nmzrxczcytkkwgpiseaj.supabase.co';
    var supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tenJ4Y3pjeXRra3dncGlzZWFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzMzM2MDYsImV4cCI6MjA5NjkwOTYwNn0.nVQxRACIt2gUiUDstNAqolozvwr23JU5eyLNi59hCSw';

    fetch(supabaseUrl + '/rest/v1/citizen_recommendations?select=*&limit=10', {
      method: 'GET',
      headers: {
        'apikey': supabaseKey,
        'Authorization': 'Bearer ' + supabaseKey
      }
    })
    .then(function(res) {
      if (!res.ok) {
        throw new Error('Supabase HTTP ' + res.status);
      }
      return res.json();
    })
    .then(function(data) {
      if (Array.isArray(data)) {
        callback(data);
      } else {
        callback([]);
      }
    })
    .catch(function(err) {
      console.warn('Direct citizen_recommendations fetch notice:', err);
      callback([]);
    });
  }

  window.renderStatusCitizenViewImpl = renderStatusCitizenView;
  window.renderStatusCitizenView = renderStatusCitizenView;

  function openCitizenReportModal() {
    document.getElementById('citizenReportModal').style.display = 'flex';
  }

  function closeCitizenReportModal() {
    document.getElementById('citizenReportModal').style.display = 'none';
  }

  function acquireCurrentGPSLocation() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(pos) {
        document.getElementById('citFormLat').value = pos.coords.latitude.toFixed(4);
        document.getElementById('citFormLng').value = pos.coords.longitude.toFixed(4);
        showToast("📍 현재 위치 좌표를 수집했습니다!");
      }, function() {
        showToast("GPS 좌표 취득 실패 (기본 세종시 좌표 사용)");
      });
    }
  }

  function submitCitizenHeritageForm(e) {
    e.preventDefault();
    var name = document.getElementById('citFormName').value.trim();
    var address = document.getElementById('citFormAddress').value.trim();
    var reason = document.getElementById('citFormReason').value.trim();
    var lat = parseFloat(document.getElementById('citFormLat').value) || 36.4800;
    var lng = parseFloat(document.getElementById('citFormLng').value) || 127.2800;

    if (!name) {
      alert('문화유산 명칭을 입력해 주세요.');
      return;
    }
    if (!address) {
      alert('소재지 주소를 입력해 주세요.');
      return;
    }
    if (!reason) {
      alert('추천 이유 및 역사적 가치를 입력해 주세요.');
      return;
    }

    var newRecord = {
      name: name,
      address: address,
      dong: address,
      reason: reason,
      description: reason,
      thinking_point: reason,
      era: "조선시대",
      lat: lat,
      latitude: lat,
      lng: lng,
      longitude: lng,
      status: "신청중",
      like_count: 1,
      image_url: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600&q=80",
      photo_url: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=600&q=80",
      submitted_by: "user@sejong.go.kr"
    };

    closeCitizenReportModal();
    showToast("☁️ Supabase DB(citizen_recommendations)에 제보서를 저장하고 있습니다...");

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success') {
            showToast("✅ 시민제보(citizen_recommendations)가 Supabase DB에 성공적으로 저장되었습니다!");
          } else {
            saveDirectToSupabase(newRecord);
          }
          renderStatusCitizenView();
        })
        .withFailureHandler(function(err) {
          console.warn('GAS submit failed, trying direct Supabase REST:', err);
          saveDirectToSupabase(newRecord);
        })
        .submitCitizenRecommendationGAS(newRecord);
    } else {
      saveDirectToSupabase(newRecord);
    }
  }

  function saveDirectToSupabase(record) {
    var supabaseUrl = 'https://nmzrxczcytkkwgpiseaj.supabase.co';
    var supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5tenJ4Y3pjeXRra3dncGlzZWFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzMzM2MDYsImV4cCI6MjA5NjkwOTYwNn0.nVQxRACIt2gUiUDstNAqolozvwr23JU5eyLNi59hCSw';

    fetch(supabaseUrl + '/rest/v1/citizen_recommendations', {
      method: 'POST',
      headers: {
        'apikey': supabaseKey,
        'Authorization': 'Bearer ' + supabaseKey,
        'Content-Type': 'application/json',
        'Prefer': 'return=representation'
      },
      body: JSON.stringify(record)
    })
    .then(function(res) {
      if (res.ok) {
        showToast("✅ Supabase DB(citizen_recommendations)에 제보가 이관 저장되었습니다!");
      } else {
        console.warn('Supabase direct POST status:', res.status);
      }
      renderStatusCitizenView();
    })
    .catch(function(err) {
      console.warn('Direct Supabase insert notice:', err);
      renderStatusCitizenView();
    });
  }
</script>
