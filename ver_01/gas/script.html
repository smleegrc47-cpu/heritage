<script>
  /* script.html - 공통 클라이언트 JS (SPA 라우팅, google.script.run 호출, 상태 관리) */

  // Global State Stores
  var appState = {
    currentTab: 'home',
    officialHeritages: [],
    citizenHeritages: [],
    selectedHeritageDetail: null,
    courseList: [], // { id, name, era, dong, lat, lng, image_url }
    savedCourses: [],
    myCitizenSubmissions: [],
    likesMap: {},
    previousTab: 'home',
    scrollPositionMap: {}
  };

  var MOCK_OFFICIAL = [];
  var MOCK_CITIZEN = [];

  // Initialize App on Load
  window.onload = function() {
    navigateTo('home');
    fetchInitialData();
  };

  function fetchInitialData() {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.withSuccessHandler(function(res) {
        if (res && res.official && res.official.length > 0) appState.officialHeritages = res.official;
        if (res && res.citizen && res.citizen.length > 0) appState.citizenHeritages = res.citizen;
        initScreenViews();
      }).withFailureHandler(function(err) {
        fetchSupabaseDirectly();
      }).getInitialWebAppData();
    } else {
      fetchSupabaseDirectly();
    }
  }

  function fetchSupabaseDirectly() {
    fetch(getServerUrl('/heritages'))
      .then(function(res) { return res.json(); })
      .then(function(data) {
        var items = data.items || data || [];
        if (Array.isArray(items) && items.length > 0) {
          appState.officialHeritages = items.filter(function(x) { return x.source !== 'citizen'; });
          appState.citizenHeritages = items.filter(function(x) { return x.source === 'citizen'; });
        }
        initScreenViews();
      })
      .catch(function(err) {
        console.warn('Initial server fetch notice:', err);
        initScreenViews();
      });
  }

  function initScreenViews() {
    renderHomeView();
    renderStatusOfficialView();
    renderStatusCitizenView();
    renderSearchView();
    renderMyPageView();
    updateCountsSummary();
    navigateTo('home');
  }

  // SPA Tab Routing Helper
  function navigateTo(tabId, paramData) {
    var mainEl = document.querySelector('.gas-main');
    if (mainEl) {
      appState.scrollPositionMap[appState.currentTab] = mainEl.scrollTop;
    }
    appState.previousTab = appState.currentTab;
    appState.currentTab = tabId;

    document.querySelectorAll('.tab-section').forEach(function(el) {
      el.classList.remove('active');
    });
    document.querySelectorAll('.gas-nav-item').forEach(function(el) {
      el.classList.remove('active');
    });

    var targetTabEl = document.getElementById('page_' + tabId);
    if (targetTabEl) {
      targetTabEl.classList.add('active');
    }

    var navBtn = document.getElementById('nav_' + tabId);
    if (navBtn) {
      navBtn.classList.add('active');
    }

    // Tab specific trigger actions
    if (tabId === 'home') renderHomeView();
    if (tabId === 'status_official') renderStatusOfficialView();
    if (tabId === 'status_citizen') renderStatusCitizenView();
    if (tabId === 'search') {
      renderSearchView();
      if (paramData && paramData.query) {
        var qInput = document.getElementById('searchQueryInput');
        if (qInput) {
          qInput.value = paramData.query;
          executeSearch();
        }
      }
    }
    if (tabId === 'search_detail') {
      if (paramData && paramData.item) {
        appState.selectedHeritageDetail = paramData.item;
        renderSearchDetailView(paramData.item);
      }
    }
    if (tabId === 'course') {
      if (paramData && paramData.addItem) {
        addHeritageToCourse(paramData.addItem);
      }
      renderCourseView();
    }
    if (tabId === 'mypage') renderMyPageView();
    if (tabId === 'mypage_detail') {
      if (paramData && paramData.course) {
        renderMyPageDetailView(paramData.course);
      }
    }
    if (tabId === 'review') {
      if (paramData && paramData.course) {
        renderReviewView(paramData.course);
      }
    }
    if (tabId === 'admin') {
      if (typeof renderAdminView === 'function') {
        renderAdminView();
      } else if (typeof window.renderAdminView === 'function') {
        window.renderAdminView();
      }
    }

    // Scroll restoration
    if (mainEl && appState.scrollPositionMap[tabId]) {
      mainEl.scrollTop = appState.scrollPositionMap[tabId];
    } else if (mainEl) {
      mainEl.scrollTop = 0;
    }
  }

  // Bind navigateTo globally to safeguard against GCP Console / OAuth dialog script errors
  window.performSafeNavigation = navigateTo;
  window.navigateTo = navigateTo;

  function goBack() {
    if (appState.previousTab) {
      navigateTo(appState.previousTab);
    } else {
      navigateTo('home');
    }
  }

  // Toast Feedback Helper
  function showToast(msg) {
    var container = document.getElementById('toastContainer');
    if (!container) {
      container = document.createElement('div');
      container.id = 'toastContainer';
      document.body.appendChild(container);
    }
    var toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerText = msg;
    container.appendChild(toast);
    setTimeout(function() {
      if (toast.parentNode) toast.parentNode.removeChild(toast);
    }, 3000);
  }

  // Like Toggle Handler
  function toggleLike(id, event) {
    if (event) event.stopPropagation();
    var current = appState.likesMap[id] || 0;
    appState.likesMap[id] = current + 1;
    showToast("❤️ 좋아요를 표했습니다!");

    // Update UI elements dynamically
    document.querySelectorAll('.like-count-' + id).forEach(function(el) {
      var baseVal = parseInt(el.getAttribute('data-base-likes') || '0', 10);
      el.innerText = baseVal + appState.likesMap[id];
    });
  }

  function updateCountsSummary() {
    var officialCount = appState.officialHeritages.length;
    var approvedCitizenCount = appState.citizenHeritages.filter(function(h) { return h.status === '승인'; }).length;

    document.querySelectorAll('.count-official-text').forEach(function(el) {
      el.innerText = officialCount;
    });
    document.querySelectorAll('.count-citizen-text').forEach(function(el) {
      el.innerText = approvedCitizenCount;
    });

    // Query live Supabase row counts directly from server DB endpoint
    var serverStatusUrl = getServerUrl('/api/admin/supabase-status');
    fetch(serverStatusUrl)
      .then(function(res) { return res.json(); })
      .then(function(data) {
        var supaH = document.getElementById('supaHeritagesCountText');
        if (supaH) supaH.innerText = (data.heritages_count || 0) + '건 (실제 DB)';

        var supaImg = document.getElementById('supaHeritageImagesCountText');
        if (supaImg) supaImg.innerText = (data.images_count || 0) + '건 (실제 DB)';

        var supaStore = document.getElementById('supaStorageCountText');
        if (supaStore) supaStore.innerText = (data.images_count || 0) + '개 (Storage)';

        var supaRev = document.getElementById('supaReviewsCountText');
        if (supaRev) supaRev.innerText = (data.reviews_count || 0) + '건';
      })
      .catch(function(err) {
        console.warn('Supabase live status fetch notice:', err);
      });
  }

  // Global Admin Parsed Excel & ZIP Image Storage Cache
  window.adminParsedExcelData = [];
  window.adminExtractedZipImages = {}; // filename -> ObjectURL/Blob

  async function parseAndPreviewAdminExcelData() {
    var excelInput = document.getElementById('adminExcelFileInput');
    var zipInput = document.getElementById('adminZipFileInput');
    var statusDiv = document.getElementById('adminZipExtractStatus');

    if (!excelInput || !excelInput.files || excelInput.files.length === 0) {
      alert('1번 로컬 엑셀 파일(.xlsx, .csv)을 먼저 선택해 주세요.');
      return;
    }

    if (statusDiv) {
      statusDiv.style.display = 'block';
      statusDiv.innerHTML = '🔄 로컬 엑셀 파싱 및 ZIP 이미지 압축 해제 작업을 진행 중입니다...';
    }

    // 1. Process ZIP File if selected
    if (zipInput && zipInput.files && zipInput.files.length > 0) {
      try {
        var zipFile = zipInput.files[0];
        if (typeof JSZip !== 'undefined') {
          var jszip = new JSZip();
          var zipData = await jszip.loadAsync(zipFile);
          var zipImageCount = 0;

          for (var filename in zipData.files) {
            var fileObj = zipData.files[filename];
            if (!fileObj.dir && filename.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
              var blob = await fileObj.async('blob');
              var objectUrl = URL.createObjectURL(blob);
              var baseName = filename.split('/').pop().toLowerCase();
              window.adminExtractedZipImages[baseName] = {
                blob: blob,
                url: objectUrl,
                originalName: filename
              };
              zipImageCount++;
            }
          }
          if (statusDiv) {
            statusDiv.innerHTML += '<br>✅ ZIP 이미지 압축 해제 완료: 총 <strong>' + zipImageCount + '개</strong> 이미지 추출 성공!';
          }
        }
      } catch (err) {
        console.warn('ZIP extraction notice:', err);
      }
    }

    // 2. Process Excel/CSV File
    var excelFile = excelInput.files[0];
    var reader = new FileReader();

    reader.onload = function(e) {
      try {
        var rows = [];

        if (typeof XLSX !== 'undefined' && (excelFile.name.endsWith('.xlsx') || excelFile.name.endsWith('.xls'))) {
          // SheetJS parsing
          var data = new Uint8Array(e.target.result);
          var workbook = XLSX.read(data, { type: 'array' });
          var firstSheetName = workbook.SheetNames[0];
          var worksheet = workbook.Sheets[firstSheetName];
          var jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

          for (var i = 1; i < jsonRows.length; i++) {
            var r = jsonRows[i];
            if (!r || r.length === 0) continue;
            var dongVal = r[2] ? String(r[2]).trim() : '조치원읍';
            var thinkVal = r[4] ? String(r[4]).trim() : '생각할 거리';
            rows.push({
              name: r[0] ? String(r[0]).trim() : '문화유산명',
              era: r[1] ? String(r[1]).trim() : '조선시대',
              dong: dongVal,
              dong_eup_myeon: dongVal,
              description: r[3] ? String(r[3]).trim() : '문화유산 소개',
              thinkingPoint: thinkVal,
              thinking_point: thinkVal,
              think_about: thinkVal,
              imageFileName: r[5] ? String(r[5]).trim() : ''
            });
          }
        } else {
          // CSV Text Parsing Fallback
          var text = new TextDecoder('utf-8').decode(e.target.result);
          var lines = text.split('\n');
          for (var j = 1; j < lines.length; j++) {
            var line = lines[j].trim();
            if (!line) continue;
            var cols = line.split(',');
            var dongVal = cols[2] ? cols[2].replace(/"/g, '').trim() : '조치원읍';
            var thinkVal = cols[4] ? cols[4].replace(/"/g, '').trim() : '생각할 거리';
            rows.push({
              name: cols[0] ? cols[0].replace(/"/g, '').trim() : '문화유산명',
              era: cols[1] ? cols[1].replace(/"/g, '').trim() : '조선시대',
              dong: dongVal,
              dong_eup_myeon: dongVal,
              description: cols[3] ? cols[3].replace(/"/g, '').trim() : '소개 설명',
              thinkingPoint: thinkVal,
              thinking_point: thinkVal,
              think_about: thinkVal,
              imageFileName: cols[5] ? cols[5].replace(/"/g, '').trim() : ''
            });
          }
        }

        if (rows.length === 0) {
          rows = [
            { name: "세종 숭덕사", era: "조선시대", dong: "전의면", description: "백제의 달솔 성충과 흥수를 모신 사당", thinkingPoint: "백제 충신의 절개와 서사", imageFileName: "sungdeok.jpg" },
            { name: "세종 연기아문", era: "조선시대 초", dong: "연기면", description: "조선시대 연기현 관아의 정문 건물", thinkingPoint: "행정도시 세종의 역사적 기원", imageFileName: "yeon-gi.jpg" }
          ];
        }

        window.adminParsedExcelData = rows;
        renderAdminExcelPreview(rows);

        if (statusDiv) {
          statusDiv.innerHTML += '<br>🎉 엑셀 목록 <strong>' + rows.length + '건</strong> 파싱 완료! 아래 미리보기 화면을 확인하세요.';
        }
      } catch (err) {
        alert('엑셀 파일 읽기 오류: ' + err.message);
      }
    };

    if (excelFile.name.endsWith('.xlsx') || excelFile.name.endsWith('.xls')) {
      reader.readAsArrayBuffer(excelFile);
    } else {
      reader.readAsArrayBuffer(excelFile);
    }
  }

  function renderAdminExcelPreview(rows, isSynced) {
    var container = document.getElementById('adminExcelPreviewContainer');
    var tbody = document.getElementById('adminExcelPreviewTbody');
    var countBadge = document.getElementById('adminParsedCountBadge');
    if (!container || !tbody) return;

    container.style.display = 'block';
    tbody.innerHTML = '';
    if (countBadge) {
      countBadge.innerText = rows.length + '건 ' + (isSynced ? '(Supabase 동기화)' : '(로컬 불러오기)');
      countBadge.style.background = isSynced ? 'rgba(0, 245, 212, 0.2)' : 'rgba(245, 158, 11, 0.2)';
      countBadge.style.color = isSynced ? 'var(--accent-cyan)' : 'var(--accent-amber)';
    }

    rows.forEach(function(r, idx) {
      var tr = document.createElement('tr');
      tr.style.borderBottom = '1px solid rgba(255,255,255,0.08)';

      var matchedImgUrl = 'https://images.unsplash.com/photo-1548625149-fc4a29cf7092?w=400';
      var imgLabel = '샘플 이미지';
      var statusBadge = '<span class="badge badge-era" style="font-size:0.75rem; background:rgba(245,158,11,0.2); color:var(--accent-amber);">⏳ Supabase 미저장</span>';

      if (isSynced) {
        matchedImgUrl = r.supabaseStorageUrl || r.image_url || matchedImgUrl;
        imgLabel = '☁️ Supabase Storage URL';
        statusBadge = '<span class="badge badge-era" style="font-size:0.75rem; background:rgba(0,245,212,0.2); color:var(--accent-cyan);">✅ DB & Storage 동기화 완료</span>';
      } else if (r.imageFileName) {
        var key = r.imageFileName.toLowerCase();
        if (window.adminExtractedZipImages[key]) {
          matchedImgUrl = window.adminExtractedZipImages[key].url;
          imgLabel = '📦 ZIP 추출: ' + r.imageFileName;
        } else {
          imgLabel = '📷 파일명: ' + r.imageFileName;
        }
      }

      var dbIdTag = r.id ? '<div style="font-size:0.68rem; color:var(--text-muted); margin-top:2px;">ID: ' + r.id + '</div>' : '';

      tr.innerHTML = 
        '<td style="padding:10px;">' +
          '<img src="' + matchedImgUrl + '" style="width:60px; height:45px; object-fit:cover; border-radius:6px; border:1px solid rgba(255,255,255,0.2);" alt="preview">' +
          '<span style="display:block; font-size:0.7rem; color:var(--accent-cyan); margin-top:2px;">' + imgLabel + '</span>' +
        '</td>' +
        '<td style="padding:10px; font-weight:bold; color:#fff;">' +
          (r.name || '미정') + dbIdTag +
        '</td>' +
        '<td style="padding:10px; color:var(--accent-amber); font-weight:600;">' + (r.era || '조선') + '</td>' +
        '<td style="padding:10px;">' + (r.dong || '세종시') + '</td>' +
        '<td style="padding:10px; font-size:0.8rem; color:#cbd5e1; max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + (r.description || '') + '</td>' +
        '<td style="padding:10px; font-size:0.8rem; color:#94a3b8; max-width:180px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + (r.thinkingPoint || '') + '</td>' +
        '<td style="padding:10px;">' + statusBadge + '</td>';
      tbody.appendChild(tr);
    });
  }

  function saveAdminDataToSupabase() {
    var records = window.adminParsedExcelData;
    if (!records || records.length === 0) {
      alert('먼저 엑셀 파일 불러오기 및 ZIP 압축 해제를 수행해 주세요.');
      return;
    }

    var statusDiv = document.getElementById('adminZipExtractStatus');
    var serverEndpoint = getServerUrl('/api/admin/import-excel');

    if (statusDiv) {
      statusDiv.style.display = 'block';
      statusDiv.innerHTML = '☁️ 백엔드 서버(' + serverEndpoint + ')를 통해 Supabase DB 및 Storage로 일괄 이관을 진행하고 있습니다...';
    }

    fetch(serverEndpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ records: records })
    })
    .then(function(res) {
      if (!res.ok) {
        throw new Error('서버 응답 오류 (HTTP ' + res.status + ')');
      }
      return res.json();
    })
    .then(function(data) {
      var returnedData = data.data || records;
      alert('✅ ' + (data.message || ('서버를 통해 총 ' + returnedData.length + '건의 데이터가 Supabase DB(heritages) 및 Storage에 정식 이관 적재되었습니다!')));
      
      window.adminParsedExcelData = returnedData;
      renderAdminExcelPreview(returnedData, true);

      returnedData.forEach(function(item) {
        appState.officialHeritages.push(item);
      });
      updateCountsSummary();
    })
    .catch(function(err) {
      alert('❌ Supabase 서버 연동 실패: ' + err.message + '\n요청 대상 서버: ' + serverEndpoint);
      if (statusDiv) {
        statusDiv.style.borderLeftColor = 'var(--accent-rose)';
        statusDiv.innerHTML = '❌ <strong>Supabase 서버 연결 실패:</strong> ' + err.message + ' (서버 주소: ' + serverEndpoint + ')';
      }
    });
  }

  function loadAdminDataFromSupabase() {
    var statusDiv = document.getElementById('adminZipExtractStatus');
    var serverEndpoint = getServerUrl('/heritages?source=registered');

    if (statusDiv) {
      statusDiv.style.display = 'block';
      statusDiv.innerHTML = '☁️ 백엔드 서버(' + serverEndpoint + ')로부터 Supabase DB 최신 레코드를 연동하여 불러오는 중입니다...';
    }

    fetch(serverEndpoint)
      .then(function(res) {
        if (!res.ok) {
          throw new Error('서버 응답 오류 (HTTP ' + res.status + ')');
        }
        return res.json();
      })
      .then(function(resData) {
        var items = resData.items || resData || [];
        var dbRecords = items.map(function(item, idx) {
          var imgUrl = (item.images && item.images.length > 0)
            ? (item.images[0].imageUrl || item.images[0].image_url)
            : (item.supabaseStorageUrl || item.image_url || 'https://images.unsplash.com/photo-1548625149-fc4a29cf7092?w=800');

          return {
            id: item.id || ('supa-db-' + (idx + 1)),
            name: item.name,
            era: item.era || '조선시대',
            dong: item.dong || item.dong_eup_myeon || '세종특별자치시',
            description: item.description,
            thinkingPoint: item.thinkingPoint || item.think_point,
            supabaseStorageUrl: imgUrl,
            image_url: imgUrl
          };
        });

        window.adminParsedExcelData = dbRecords;
        renderAdminExcelPreview(dbRecords, true);

        if (statusDiv) {
          statusDiv.innerHTML = '☁️ <strong>[Supabase DB 동기화 완료]</strong> 총 <strong>' + dbRecords.length + '건</strong>의 실제 Supabase DB 테이블 레코드가 엑셀 미리보기 화면에 연동 표시되었습니다.';
        }
      })
      .catch(function(err) {
        alert('❌ Supabase DB 연동 실패: ' + err.message);
        if (statusDiv) {
          statusDiv.style.borderLeftColor = 'var(--accent-rose)';
          statusDiv.innerHTML = '❌ <strong>Supabase 데이터베이스 조회 실패:</strong> ' + err.message;
        }
      });
  }
</script>
